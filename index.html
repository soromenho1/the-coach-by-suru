<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1f3a"><title>The Coach by Suru</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#10233f}.app{max-width:520px;margin:auto;min-height:100vh;padding:28px 18px 90px}.brand{font-size:30px;font-weight:900;letter-spacing:-1px}.brand small{display:block;font-size:14px;color:#2f80ed;letter-spacing:1px}.hero{padding:38px 0 20px}.muted{color:#718096}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 8px 24px #10233f0d}.btn{width:100%;border:0;border-radius:16px;padding:16px;margin:7px 0;font-size:16px;font-weight:750;background:#2f80ed;color:#fff}.dark{background:#0b1f3a}.green{background:#27ae60}.light{background:#eaf2ff;color:#185fbd}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{border:0;background:#fff;border-radius:50%;width:42px;height:42px;font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat b{font-size:26px;display:block}.student{display:flex;align-items:center}.avatar{width:46px;height:46px;border-radius:50%;background:#eaf2ff;display:grid;place-items:center;font-weight:800;color:#2f80ed}.student-info{flex:1;margin-left:12px}.tag{font-size:12px;background:#e8f8ee;color:#168344;padding:5px 9px;border-radius:99px}.set{display:grid;grid-template-columns:30px 1fr 1fr 1fr;gap:7px;align-items:center;margin:8px 0}.set input{width:100%;padding:10px 3px;border:1px solid #dce3ec;border-radius:10px;text-align:center;font-size:15px}.progress{height:9px;background:#e6edf5;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;width:72%;background:#27ae60}.alert{background:#fff7e8}.success{text-align:center;padding-top:100px}h1,h2,h3,p{margin-top:0}
</style></head><body><div id="app"></div><script>
const students=[{id:1,name:'Marta Silva',goal:'Hipertrofia',weight:'64,2 kg',fat:'23%',waist:'71 cm'},{id:2,name:'Ana Costa',goal:'Perda de peso',weight:'72,8 kg',fat:'29%',waist:'79 cm'},{id:3,name:'Joana Alves',goal:'Performance',weight:'61,5 kg',fat:'20%',waist:'68 cm'}];let role=null;const A=document.querySelector('#app');const brand=()=>'<div class="brand">THE COACH<small>by Suru</small></div>';function page(x){A.innerHTML='<main class="app">'+x+'</main>'}function header(t,b){return '<div class="top">'+(b?'<button class="back" onclick="'+b+'">‹</button>':'')+brand()+'</div><h2>'+t+'</h2>'}
function login(){page(brand()+'<div class="hero"><h1>O teu acompanhamento.<br>Num só lugar.</h1><p class="muted">Treino, evolução e consistência.</p></div><div class="card"><h3>Entrar como</h3><button class="btn dark" onclick="role=\'trainer\';trainer()">Treinador</button><button class="btn" onclick="role=\'student\';student()">Aluno</button></div><p class="muted" style="text-align:center;margin-top:30px">MVP • dados de demonstração</p>')}
function trainer(){page(header('Bom dia, Coach 👋')+'<div class="grid"><div class="card stat"><b>12</b><span class="muted">Alunos ativos</span></div><div class="card stat"><b>8</b><span class="muted">Treinos hoje</span></div></div><div class="card alert"><b>3 check-ins pendentes</b><p class="muted">Revê o feedback dos teus alunos.</p></div><button class="btn dark" onclick="list()">Ver alunos</button><button class="btn light">Planos de treino</button><div class="card"><b>Adesão semanal: 72%</b><div class="progress" style="margin-top:12px"><i></i></div></div>')}
function list(){page(header('Alunos','trainer()')+students.map(s=>'<div class="card student" onclick="profile('+s.id+')"><div class="avatar">'+s.name[0]+'</div><div class="student-info"><b>'+s.name+'</b><div class="muted">'+s.goal+'</div></div><span>›</span></div>').join(''))}
function profile(id){const s=students.find(x=>x.id===id);page(header(s.name,'list()')+'<span class="tag">ATIVO</span><div class="grid"><div class="card stat"><b>'+s.weight+'</b><span class="muted">Peso</span></div><div class="card stat"><b>'+s.fat+'</b><span class="muted">Massa gorda</span></div></div><div class="card"><b>Objetivo</b><p>'+s.goal+'</p><b>Cintura</b><p>'+s.waist+'</p></div><button class="btn dark" onclick="plan('+id+')">Plano de treino</button><button class="btn light">Avaliações e perímetros</button><button class="btn light">Check-in semanal</button>')}
function plan(id){page(header('Plano de treino','profile('+id+')')+'<div class="card"><span class="tag">TREINO A</span><h2>Upper Body</h2><p class="muted">Peito • Costas • Ombros</p><h3>Supino com barra</h3><p>4 × 8–10 · 90s</p><h3>Remada baixa</h3><p>4 × 10–12 · 75s</p><h3>Press militar</h3><p>3 × 8–10 · 75s</p></div><button class="btn green" onclick="workout()">Iniciar treino</button>')}
function student(){page(header('Olá, Marta 👋')+'<div class="card"><span class="tag">HOJE</span><h2>Upper Body</h2><p class="muted">4 exercícios · ~55 min</p><button class="btn green" onclick="workout()">Começar treino</button></div><div class="grid"><div class="card"><b style="font-size:30px">1,5L</b><p class="muted">Água / 2,5L</p></div><div class="card"><b>20 min</b><p class="muted">Cardio semanal</p></div></div><div class="card"><b>Progresso</b><p class="muted">Peso atual 64,2 kg</p><div class="progress"><i></i></div></div>')}
function workout(){const ex=['Supino com barra','Remada baixa','Press militar'];page(header('Treino em curso',role==='trainer'?'trainer()':'student()')+ex.map((e,j)=>'<div class="card"><h3>'+(j+1)+'. '+e+'</h3><div class="set"><b>#</b><small>KG</small><small>REPS</small><small>RIR</small></div>'+[1,2,3].map(i=>'<div class="set"><b>'+i+'</b><input type="number"><input type="number"><input type="number"></div>').join('')+'</div>').join('')+'<button class="btn green" onclick="done()">Concluir treino</button>')}
function done(){page('<div class="success"><div style="font-size:70px">✅</div>'+brand()+'<h1 style="margin-top:30px">Treino concluído!</h1><p class="muted">Bom trabalho. As cargas ficaram registadas nesta sessão.</p><button class="btn dark" onclick="'+(role==='trainer'?'trainer()':'student()')+'">Voltar ao dashboard</button></div>')}login();
</script></body></html>
