<!doctype html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B1F3A"><title>The Coach by Suru v0.2</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#10233f}.app{max-width:520px;margin:auto;min-height:100vh;padding:24px 18px 100px}.brand{font-size:29px;font-weight:900;letter-spacing:-1px;color:#0b1f3a}.brand small{display:block;font-size:13px;font-weight:700;color:#2f80ed;letter-spacing:1.5px}.hero{padding:34px 0 20px}.muted{color:#718096}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 8px 28px #10233f0d}.btn{width:100%;border:0;border-radius:15px;padding:15px;margin:7px 0;font-size:16px;font-weight:750;background:#2f80ed;color:#fff}.dark{background:#0b1f3a}.green{background:#27ae60}.light{background:#eaf2ff;color:#185fbd}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{border:0;background:#fff;border-radius:50%;width:42px;height:42px;font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.stat b{font-size:25px;display:block}.student{display:flex;justify-content:space-between;align-items:center}.avatar{width:46px;height:46px;border-radius:50%;background:#eaf2ff;display:grid;place-items:center;font-weight:800;color:#2f80ed}.student-info{flex:1;margin-left:12px}.tag{font-size:11px;background:#e8f8ee;color:#168344;padding:5px 9px;border-radius:99px}.progress{height:9px;background:#e6edf5;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#27ae60}.section{margin-top:25px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.input,label select,textarea{width:100%;padding:12px;border:1px solid #dbe3ed;border-radius:12px;background:#fff;font:inherit;margin:5px 0 11px}label{font-size:13px;font-weight:700;color:#52657a}.module{display:flex;align-items:center;gap:13px}.ico{width:42px;height:42px;border-radius:13px;background:#eef4ff;display:grid;place-items:center;font-size:21px}.module div:nth-child(2){flex:1}.module b{display:block}.module small{color:#718096}.set{display:grid;grid-template-columns:30px 1fr 1fr 1fr;gap:6px;align-items:center;margin:7px 0}.set input{width:100%;padding:9px 3px;border:1px solid #dce3ec;border-radius:9px;text-align:center}.check{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #edf1f5}.check:last-child{border:0}.pill{background:#f0f4f8;border-radius:99px;padding:5px 9px;font-size:12px}.water{font-size:34px;font-weight:900}.quick{display:flex;gap:6px}.quick button{border:0;background:#eaf2ff;color:#185fbd;border-radius:10px;padding:9px;flex:1;font-weight:700}.chart{height:130px;display:flex;align-items:end;gap:9px;padding-top:15px}.bar{flex:1;background:#2f80ed;border-radius:7px 7px 2px 2px;min-height:20px;position:relative}.bar span{position:absolute;bottom:-22px;width:100%;text-align:center;font-size:10px;color:#718096}.notice{background:#fff8e9}.success{text-align:center;padding-top:80px}.success .tick{font-size:65px}h1,h2,h3,p{margin-top:0}.nav{position:fixed;bottom:0;left:0;right:0;padding:12px;background:#fff;border-top:1px solid #e7edf4;text-align:center;color:#718096;font-size:12px}
</style></head><body><div id="app"></div><script>
const students=[{id:1,name:'Marta Silva',goal:'Hipertrofia',weight:64.2,fat:23,waist:71},{id:2,name:'Ana Costa',goal:'Perda de peso',weight:72.8,fat:29,waist:79},{id:3,name:'Joana Alves',goal:'Performance',weight:61.5,fat:20,waist:68}];let role=null,current=1,water=1500;const A=document.querySelector('#app');
const brand=()=>'<div class="brand">THE COACH<small>by Suru · v0.2</small></div>';const page=x=>A.innerHTML='<main class="app">'+x+'</main>';const head=(t,b)=>'<div class="top">'+(b?'<button class="back" onclick="'+b+'">‹</button>':'')+brand()+'</div><h2>'+t+'</h2>';
function login(){page(brand()+'<div class="hero"><h1>O teu acompanhamento.<br>Num só lugar.</h1><p class="muted">Treino, evolução e consistência.</p></div><div class="card"><h3>Entrar como</h3><button class="btn dark" onclick="role=\'trainer\';trainer()">Treinador</button><button class="btn" onclick="role=\'student\';current=1;student()">Aluno</button></div><p class="muted" style="text-align:center;margin-top:28px">Protótipo funcional · dados de demonstração</p>')}
function trainer(){page(head('Bom dia, Coach 👋')+'<div class="grid"><div class="card stat"><b>12</b><span class="muted">Alunos ativos</span></div><div class="card stat"><b>8</b><span class="muted">Treinos hoje</span></div></div><div class="card notice"><b>3 check-ins pendentes</b><p class="muted">Há feedback de alunos para rever.</p></div><button class="btn dark" onclick="list()">Gerir alunos</button><div class="card"><b>Adesão semanal · 72%</b><div class="progress" style="margin-top:12px"><i style="width:72%"></i></div></div>')}
function list(){page(head('Alunos','trainer()')+students.map(s=>'<div class="card student" onclick="profile('+s.id+')"><div class="avatar">'+s.name[0]+'</div><div class="student-info"><b>'+s.name+'</b><div class="muted">'+s.goal+'</div></div><span>›</span></div>').join(''))}
function profile(id){current=id;let s=students.find(x=>x.id===id);page(head(s.name,'list()')+'<span class="tag">ATIVO</span><div class="grid"><div class="card stat"><b>'+s.weight.toFixed(1).replace('.',',')+' kg</b><span class="muted">Peso</span></div><div class="card stat"><b>'+s.fat+'%</b><span class="muted">Massa gorda</span></div></div>'+modules()+'<button class="btn dark" onclick="plan()">Plano de treino</button>')}
function modules(){return '<h3 class="section">Acompanhamento</h3>'+[['🩺','Anamnese','Saúde, histórico e objetivos','anam()'],['📏','Avaliação física','Peso, gordura e perímetros','evals()'],['📈','Evolução','Histórico e gráficos','progress()'],['💧','Água','Objetivo e consumo diário','hydration()'],['🏃','Cardio','Registar sessões','cardio()'],['📝','Check-in semanal','Sono, energia, stress e dor','checkin()']].map(m=>'<div class="card module" onclick="'+m[3]+'"><div class="ico">'+m[0]+'</div><div><b>'+m[1]+'</b><small>'+m[2]+'</small></div><span>›</span></div>').join('')}
const backProfile=()=>role==='trainer'?'profile('+current+')':'student()';
function anam(){page(head('Anamnese',backProfile())+'<div class="card"><label>Objetivo principal<input class="input" value="Hipertrofia e melhoria da composição corporal"></label><label>Lesões / limitações<textarea rows="3" placeholder="Descreve lesões, dores ou limitações"></textarea></label><label>Medicação<textarea rows="2" placeholder="Medicação habitual"></textarea></label><label>Experiência de treino<select><option>Intermédio</option><option>Iniciante</option><option>Avançado</option></select></label><label>Dias disponíveis / semana<input class="input" type="number" value="4"></label><label>Observações<textarea rows="3"></textarea></label><button class="btn green" onclick="alert(\'Anamnese guardada nesta demonstração.\')">Guardar anamnese</button></div>')}
function evals(){let s=students.find(x=>x.id===current);page(head('Avaliação física',backProfile())+'<div class="card"><div class="row"><label>Peso (kg)<input class="input" value="'+s.weight+'"></label><label>Altura (cm)<input class="input" value="165"></label></div><div class="row"><label>Massa gorda (%)<input class="input" value="'+s.fat+'"></label><label>Cintura (cm)<input class="input" value="'+s.waist+'"></label></div><div class="row"><label>Peito (cm)<input class="input" value="91"></label><label>Anca (cm)<input class="input" value="96"></label></div><div class="row"><label>Braço (cm)<input class="input" value="29"></label><label>Coxa (cm)<input class="input" value="55"></label></div><button class="btn green" onclick="alert(\'Avaliação registada nesta demonstração.\')">Guardar avaliação</button></div>')}
function progress(){page(head('Evolução',backProfile())+'<div class="grid"><div class="card stat"><b>-2,4 kg</b><span class="muted">Últimas 8 semanas</span></div><div class="card stat"><b>-3 cm</b><span class="muted">Cintura</span></div></div><div class="card"><b>Evolução do peso</b><div class="chart">'+[90,82,76,68,60,54,48,43].map((h,i)=>'<div class="bar" style="height:'+h+'%"><span>S'+(i+1)+'</span></div>').join('')+'</div></div><div class="card"><b>Composição corporal</b><div class="check"><span>Massa gorda</span><b>25% → 23%</b></div><div class="check"><span>Cintura</span><b>74 → 71 cm</b></div></div>')}
function hydration(){page(head('Água',backProfile())+'<div class="card"><p class="muted">Consumo de hoje</p><div class="water" id="w">'+(water/1000).toFixed(2).replace('.',',')+' L</div><p>Objetivo: 2,5 L</p><div class="progress"><i id="wp" style="width:'+Math.min(100,water/25)+'%"></i></div><div class="quick" style="margin-top:18px"><button onclick="addWater(250)">+250 ml</button><button onclick="addWater(500)">+500 ml</button><button onclick="addWater(750)">+750 ml</button></div></div>')};function addWater(x){water+=x;document.querySelector('#w').innerText=(water/1000).toFixed(2).replace('.',',')+' L';document.querySelector('#wp').style.width=Math.min(100,water/25)+'%'}
function cardio(){page(head('Cardio',backProfile())+'<div class="card"><label>Tipo<select><option>Caminhada</option><option>Corrida</option><option>Bicicleta</option><option>Elíptica</option></select></label><div class="row"><label>Duração (min)<input class="input" type="number" value="30"></label><label>Distância (km)<input class="input" type="number" value="4.2"></label></div><div class="row"><label>FC média<input class="input" type="number" value="128"></label><label>Esforço 1–10<input class="input" type="number" value="6"></label></div><button class="btn green" onclick="alert(\'Sessão de cardio registada.\')">Registar cardio</button></div><div class="card"><b>Esta semana</b><div class="check"><span>2 sessões</span><b>55 min</b></div></div>')}
function checkin(){page(head('Check-in semanal',backProfile())+'<div class="card">'+[['Peso atual','64.2'],['Treinos realizados','4'],['Sono (1–10)','7'],['Energia (1–10)','8'],['Stress (1–10)','5'],['Fome (1–10)','6'],['Dor/desconforto (1–10)','2']].map(x=>'<label>'+x[0]+'<input class="input" value="'+x[1]+'"></label>').join('')+'<label>Como correu a semana?<textarea rows="3" placeholder="Notas para o treinador"></textarea></label><button class="btn green" onclick="alert(\'Check-in enviado ao treinador.\')">Enviar check-in</button></div>')}
function plan(){page(head('Plano de treino',backProfile())+'<div class="card"><span class="tag">TREINO A</span><h2 style="margin-top:12px">Upper Body</h2><p class="muted">Peito · Costas · Ombros</p><div class="check"><span>Supino com barra</span><b>4 × 8–10</b></div><div class="check"><span>Remada baixa</span><b>4 × 10–12</b></div><div class="check"><span>Press militar</span><b>3 × 8–10</b></div><div class="check"><span>Puxada frontal</span><b>3 × 10–12</b></div></div><button class="btn green" onclick="workout()">Iniciar treino</button>')}
function workout(){let ex=['Supino com barra','Remada baixa','Press militar'];page(head('Treino em curso','plan()')+ex.map((e,j)=>'<div class="card"><h3>'+(j+1)+'. '+e+'</h3><div class="set"><b>#</b><small>KG</small><small>REPS</small><small>RIR</small></div>'+[1,2,3].map(i=>'<div class="set"><b>'+i+'</b><input type="number"><input type="number"><input type="number"></div>').join('')+'</div>').join('')+'<button class="btn green" onclick="done()">Concluir treino</button>')}
function student(){let s=students[0];page(head('Olá, '+s.name.split(' ')[0]+' 👋')+'<div class="card"><span class="tag">TREINO DE HOJE</span><h2 style="margin-top:12px">Upper Body</h2><p class="muted">4 exercícios · ~55 min</p><button class="btn green" onclick="plan()">Começar treino</button></div>'+modules())}
function done(){page('<div class="success"><div class="tick">✅</div>'+brand()+'<h1 style="margin-top:25px">Treino concluído!</h1><p class="muted">Cargas, repetições e RIR registados nesta sessão.</p><button class="btn dark" onclick="'+(role==='trainer'?'trainer()':'student()')+'">Voltar ao dashboard</button></div>')}
login();
</script></body></html>
